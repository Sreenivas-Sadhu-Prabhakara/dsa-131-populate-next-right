<text x="56.0" y="520.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Each level becomes a linked list: 2→3, 4→5→6→7. BFS with a queue also works but</text>
